<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Proposaly Inbound Agent – Test Pages</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Syne:wght@700;800&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --bg:#0d0f14; --surface:#161921; --border:#252932; --accent:#5b6af5; --accent2:#a78bfa; --text:#e8eaf0; --muted:#6b7280; }
    body { background:var(--bg); color:var(--text); font-family:'Inter',sans-serif; min-height:100vh; display:flex; flex-direction:column; }
    header { border-bottom:1px solid var(--border); padding:20px 40px; display:flex; align-items:center; gap:12px; }
    .logo-dot { width:10px; height:10px; border-radius:50%; background:var(--accent); box-shadow:0 0 8px var(--accent); }
    header span { font-family:'Syne',sans-serif; font-size:15px; font-weight:700; letter-spacing:.04em; }
    .badge { margin-left:auto; font-size:11px; font-weight:600; color:var(--accent); background:rgba(91,106,245,.12); border:1px solid rgba(91,106,245,.3); padding:3px 10px; border-radius:20px; letter-spacing:.06em; text-transform:uppercase; }
    main { width:100%; max-width:900px; margin:0 auto; padding:64px 40px 80px; }
    h1 { font-family:'Syne',sans-serif; font-size:clamp(28px,4vw,40px); font-weight:800; letter-spacing:-.02em; margin-bottom:12px; }
    main > p { color:var(--muted); line-height:1.7; margin-bottom:32px; }
    ul { list-style:none; display:grid; gap:12px; }
    li a { display:flex; justify-content:space-between; gap:16px; flex-wrap:wrap; background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:20px 24px; color:var(--text); text-decoration:none; font-weight:600; }
    li a:hover { border-color:var(--accent); }
    li code { color:var(--accent2); font-size:12px; font-weight:400; word-break:break-all; }
    footer { margin-top:auto; border-top:1px solid var(--border); padding:20px 40px; font-size:12px; color:var(--muted); }
    @media (max-width:600px) { header, main, footer { padding-left:20px; padding-right:20px; } main { padding-top:40px; } }
  </style>
</head>
<body>
  <header>
    <div class="logo-dot"></div>
    <span>Proposaly · Inbound Agent</span>
    <span class="badge">Test Env</span>
  </header>
  <main>
    <h1>Inbound Agent Test Pages</h1>
    <p>Mỗi trang nhúng một inbound agent riêng. Mở trang để kiểm tra widget.</p>
    <ul>
      <!-- PAGES:START -->
      <li><a href="pages/inbound-1.html">inbound-1 <code>kn4MQKccqNecgPd-oCCDGYL57Ti1weLFWlUV8hzvXSI</code></a></li>
      <!-- PAGES:END -->
    </ul>
  </main>
  <footer>Proposaly QA Team</footer>
</body>
</html>
